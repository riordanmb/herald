version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: herald-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-herald}
      POSTGRES_USER: ${POSTGRES_USER:-herald}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-herald_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-herald}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - herald-network

  redis:
    image: redis:7-alpine
    container_name: herald-redis
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - herald-network

  minio:
    image: minio/minio:latest
    container_name: herald-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - herald-network

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: herald-backend
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      - DEBUG=True
      - DATABASE_URL=postgresql://herald:herald_dev_password@postgres:5432/herald
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ../../backend:/app
      - backend_media:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - herald-network

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile.dev
    container_name: herald-frontend
    command: npm run dev
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
      - NEXT_PUBLIC_PALEOGRAPHY_API_URL=http://localhost:8080
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ../../frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    networks:
      - herald-network

  paleography:
    build:
      context: ../../paleography
      dockerfile: Dockerfile
    container_name: herald-paleography
    command: uvicorn app.main:app --host 0.0.0.0 --port 8080 --reload
    environment:
      - DATABASE_URL=postgresql://herald:herald_dev_password@postgres:5432/herald
      - REDIS_URL=redis://redis:6379/2
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - TORCH_DEVICE=cpu
    ports:
      - "${PALEOGRAPHY_PORT:-8080}:8080"
    volumes:
      - ../../paleography:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - herald-network

volumes:
  postgres_data:
  redis_data:
  minio_data:
  backend_media:

networks:
  herald-network:
    driver: bridge
